            - paragraph [ref=e24]
          - generic [ref=e25]:
            - heading [level=3] [ref=e26]:
              - strong [ref=e27]: Job description
            - paragraph [ref=e28]: Terra Quantum is hiring a Product Marketing Manager to own marketing across our quantum technology portfolio.
            - paragraph [ref=e29]: This is a senior, hands-on role for someone who can take deeply technical products to market with clarity, accuracy and commercial judgement. You will define how we position, explain and promote our products, working directly with the scientists, engineers and commercial teams who build and shape them.
            - heading "About the Role" [level=3] [ref=e30]
            - paragraph [ref=e31]: This is an end-to-end role with real ownership. You will turn advanced, hard-to-explain products into clear, credible market narratives, and build what carries them to buyers.
            - paragraph [ref=e32]: It needs both strategy and hands-on execution. You will write, brief, research, shape narratives and build assets, and you will spend real time with our scientists and engineers to get the substance right, because accuracy is not optional here.
            - paragraph [ref=e33]: The portfolio spans different technologies and audiences, so getting credible in a new domain quickly matters as much as depth in any one. This role suits someone who has owned a technical product's narrative, not only run the campaigns around it.
            - heading "What You Will Own" [level=3] [ref=e34]
            - paragraph [ref=e35]: "You will lead product marketing across the portfolio, including:"
            - list [ref=e36]:
              - listitem [ref=e37]:
                - paragraph [ref=e38]: Positioning and messaging for products, use cases and buyer personas
              - listitem [ref=e39]:
                - paragraph [ref=e40]: Product pages and web content
              - listitem [ref=e41]:
                - paragraph [ref=e42]: Go-to-market planning for launches and commercial initiatives
              - listitem [ref=e43]:
                - paragraph [ref=e44]: Campaigns and core messaging across the channels that fit the buyer
              - listitem [ref=e45]:
                - paragraph [ref=e46]: Long and short-form content, with technical and scientific contributors where needed
              - listitem [ref=e47]:
                - paragraph [ref=e48]: "Sales enablement: decks, one-pagers, keynote presentations and product marketing assets"
              - listitem [ref=e49]:
                - paragraph [ref=e50]: Messaging and materials for conferences, roundtables and customer conversations
              - listitem [ref=e51]:
                - paragraph [ref=e52]: Buyer, competitor and market research to sharpen each category
              - listitem [ref=e53]:
                - paragraph [ref=e54]: Close work with product, research, engineering and commercial to keep marketing accurate and differentiated
            - heading "What We Are Looking For" [level=3] [ref=e55]
            - paragraph [ref=e56]: "You will combine strong writing, technical curiosity and commercial instinct. You should bring:"
            - list [ref=e57]:
              - listitem [ref=e58]:
                - paragraph [ref=e59]: Experience in B2B product marketing or technical marketing
              - listitem [ref=e60]:
                - paragraph [ref=e61]: A track record marketing a technical product category, for example cybersecurity, enterprise software, cloud infrastructure, developer tools, AI, data or analytics, or scientific or industrial software
              - listitem [ref=e62]:
                - paragraph [ref=e63]: Strong writing, and the ability to turn dense material into something a busy expert will actually read
              - listitem [ref=e64]:
                - paragraph [ref=e65]: A good grasp of enterprise buying and considered-purchase sales cycles
              - listitem [ref=e66]:
                - paragraph [ref=e67]: Comfort working with technical experts and translating their work without dumbing it down
              - listitem [ref=e68]:
                - paragraph [ref=e69]: The range to move between different technologies and buyers, and get up to speed fast
              - listitem [ref=e70]:
                - paragraph [ref=e71]: Confidence owning a product area on your own, while working closely with product and sales
              - listitem [ref=e72]:
                - paragraph [ref=e73]: Sound judgement on accuracy, claims and tone
              - listitem [ref=e74]:
                - paragraph [ref=e75]: Comfort operating in a small, high-autonomy marketing environment
            - heading "Valuable Experience" [level=3] [ref=e76]
            - paragraph [ref=e77]: "Any of the following would be a bonus:"
            - list [ref=e78]:
              - listitem [ref=e79]:
                - paragraph [ref=e80]: Depth in security, AI or machine learning, optimisation, simulation, scientific computing or another advanced technical field
              - listitem [ref=e81]:
                - paragraph [ref=e82]: Marketing to technical and enterprise buyers, from CISOs and security or infrastructure leaders to operations, engineering or R&D decision-makers
              - listitem [ref=e83]:
                - paragraph [ref=e84]: Product launches and early-stage go-to-market for technical products
              - listitem [ref=e85]:
                - paragraph [ref=e86]: Sales enablement for enterprise or strategic-account teams
              - listitem [ref=e87]:
                - paragraph [ref=e88]: Content built for expert audiences
              - listitem [ref=e89]:
                - paragraph [ref=e90]: Executive roundtables, webinars, conferences or field marketing in technical markets
              - listitem [ref=e91]:
                - paragraph [ref=e92]: Working with Figma and/or other Design tools to brief, review and assemble marketing and sales assets
            - heading "Impact" [level=3] [ref=e93]
            - paragraph [ref=e94]: You will contribute to shaping how novel technology is being brought to the market, helping make it understandable and credible. Ultimately, you will have a high-ownership role in driving quantum technology to earn attention and trust in markets that will greatly benefit from it, but still have an education curve ahead.
            - paragraph [ref=e95]
          - generic [ref=e96]:
            - paragraph [ref=e97]:
              - strong [ref=e98]: The Rewards
            - paragraph [ref=e99]: "We are an international team of quantum technology experts and dedicated business creatives that are working to bring quantum-enabled solutions to the global market. Our brilliant team members enjoy a high degree of freedom working remotely or joining one of our office spaces. We have a vibrant, enthusiastic, passionate and creative culture driven by trust, excellence and continuous improvement. If you join the Terra Quantum team, you can expect:"
            - list [ref=e100]:
              - listitem [ref=e101]: An opportunity to work with some of the brightest minds in the pioneering field of Quantum Technologies as well as an experienced and progressive Leadership team
              - listitem [ref=e102]: Gain knowledge of some of the most cutting-edge technology developments in science & engineering
              - listitem [ref=e103]: A chance to be part of one of Europe’s leading technology firms of the upcoming decades
              - listitem [ref=e104]: Welcoming, friendly, and professional colleagues
              - listitem [ref=e105]: A personal development plan with clear goals for advancement
              - listitem [ref=e106]: A competitive salary
              - listitem [ref=e107]: Flexible working arrangements
              - listitem [ref=e108]: A diverse and supportive atmosphere, where innovation and initiative are encouraged
            - paragraph [ref=e109]: If you are enthusiastic about positively impacting the world and helping to drive the second quantum revolution, let’s talk!
            - paragraph [ref=e110]
            - paragraph [ref=e111]:
              - strong [ref=e112]: Company description
            - paragraph [ref=e113]: Quantum technologies have the potential to solve some of the world’s biggest challenges. There have been great advances in all areas of quantum technologies, and new fields of application are opened up every day. Hybrid computer systems that combine classic high-performance computing with quantum computers are already being used to develop solutions in sectors such as logistics, healthcare, finance, energy, automotive and aerospace. Quantum mechanical predictions are also used to obtain unprecedented precision in measurements, generate unbreakable codes, and form the basis of impenetrable communication networks. All these developments are happening right now, and they are happening at Terra Quantum.
            - paragraph [ref=e114]: "At Terra Quantum we are building the world’s leading Quantum Technology company. We offer customers world-class quantum technology expertise organized as “quantum-as-a-service”: hybrid quantum algorithms, quantum compute and quantum enabled security solutions. Through the proprietary quantum cloud, customers have access to a unique technology platform which provides a toolset to solve real-world challenges in the realms of machine learning, optimization and simulation, today. In 2022, the company closed its Series A financing round with a $75m fundraise."
            - paragraph [ref=e115]: "Quantum physics has, in some respects, parallels to the machine language of our computers-the zeros and ones into which our keyboard or touchscreen instructions are translated for execution in the computer-only on a larger scale: it is the machine language of the universe. The second quantum revolution is based on the control of individual quantum systems, such as individual atoms. We use quantum computers to solve currently unsolvable problems, simulate molecules and their interactions, find drugs for diseases that are not yet curable, find new materials, or make artificial intelligence stronger. Quantum is now."
            - paragraph [ref=e116]: Terra Quantum is a future-focused quantum services and technology company working on making the second quantum revolution a reality. Terra Quantum’s activities span all areas, markets, and industries globally.
            - list [ref=e117]:
              - listitem [ref=e118]: Our purpose is to pioneer quantum technologies to change the world for good,
              - listitem [ref=e119]: Our vision is to lead the quantum revolution and be the trailblazer in technology solutions, shaping a better future for humankind to thrive in, and
              - listitem [ref=e120]: Our mission is to unleash the power of quantum tech to deliver meaningful solutions today
            - paragraph [ref=e121]: Terra Quantum is an equal opportunities employer, committed to diversity, inclusion and employee well-being.
