# The request inbox's fast lane (telegram-request-listener): holds a long poll open on the user's
# Telegram bot, writes each arriving request into the durable queue, and wakes the inbox agent
# straight away -- so a Telegram request starts being worked in seconds rather than on the next
# minute's cron tick. The cron check remains the backstop for Slack and for any window where this
# service is down.
[program:telegram-request-listener]
command=python3 system/services/oom_priority/bin/oom_tag_service.py telegram-request-listener uv run python .agents/skills/slack-request-inbox/scripts/telegram_listener.py
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/telegram-request-listener-stdout.log
stderr_logfile=/var/log/supervisor/telegram-request-listener-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
